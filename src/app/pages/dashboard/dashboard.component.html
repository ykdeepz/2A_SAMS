<div class="dashboard animate-fade-in">

  <!-- Stats Grid -->
  <div class="stats-grid">
    @for (stat of stats(); track stat.label) {
      <div class="stat-card">
        <div class="stat-body">
          <div>
            <p class="stat-label">{{stat.label}}</p>
            <p class="stat-value">{{stat.value}}</p>
          </div>
          <div class="stat-icon" [class]="stat.bgColor + ' ' + stat.textColor">
            <lucide-icon [img]="getIconComponent(stat.icon)" [size]="20"></lucide-icon>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Calendar -->
  @if (calendarVisible()) {
    <div class="calendar-wrapper">
      <app-calendar></app-calendar>
    </div>
  }
</div>
