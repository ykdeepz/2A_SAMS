<div class="space-y-4 md:space-y-6 animate-fade-in">

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-6">
    @for (stat of stats(); track stat.label) {
      <div class="bg-white rounded-lg md:rounded-xl border border-slate-200 shadow-sm p-4 md:p-6 hover:shadow-lg transition-shadow duration-200">
        <div class="flex items-center justify-between gap-3">
          <div>
            <p class="text-xs md:text-sm font-medium text-slate-600 mb-1">{{stat.label}}</p>
            <p class="text-2xl md:text-3xl font-bold text-slate-800">{{stat.value}}</p>
          </div>
          <div [class]="'w-10 md:w-12 h-10 md:h-12 rounded-lg md:rounded-xl flex items-center justify-center flex-shrink-0 ' + stat.bgColor + ' ' + stat.textColor">
            <lucide-icon [img]="getIconComponent(stat.icon)" [size]="20"></lucide-icon>
          </div>
        </div>
      </div>
    }
  </div>


  <!-- Calendar -->
  @if (calendarVisible()) {
    <div class="bg-white rounded-lg md:rounded-xl border border-slate-200 shadow-sm p-3 md:p-4 hover:shadow-lg transition-shadow duration-200">
      <app-calendar></app-calendar>
    </div>
  }
</div>
